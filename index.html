<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1>待辦清單</h1>

    <!-- 新增待辦事項的輸入區 -->
    <form id="todo-form" class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      >
      <button type="submit" id="add-btn">新增</button>
    </form>

    <!-- 待辦清單顯示區 -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- 清單為空時顯示的提示文字 -->
    <p id="empty-hint" class="empty-hint">還沒有任何待辦事項,新增一個吧!</p>

    <!-- 底部統計未完成項目數量 -->
    <div class="footer">
      <span id="remaining-count">未完成:0 項</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
